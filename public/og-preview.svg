<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#090A0F" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="60%" cy="30%" r="60%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  
  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" stroke="#1F293D" stroke-width="2" />

  <!-- Badge -->
  <rect x="80" y="100" width="340" height="36" rx="18" fill="#131823" stroke="#3B82F6" stroke-width="1.5" />
  <circle cx="102" cy="118" r="4" fill="#60A5FA" />
  <text x="120" y="123" fill="#93C5FD" font-family="monospace" font-size="14" font-weight="600">FULL-STACK & BACKEND DEVELOPER</text>

  <!-- Main Headline -->
  <text x="80" y="210" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">
    T S Sampath Srinivas Maddi
  </text>
  
  <text x="80" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Building scalable web applications, distributed platforms, and AI-powered products.
  </text>

  <!-- Key Stack Badges -->
  <g transform="translate(80, 340)">
    <!-- React -->
    <rect x="0" y="0" width="120" height="42" rx="10" fill="#131823" stroke="#2D3B55" />
    <text x="60" y="26" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">React 18</text>

    <!-- TypeScript -->
    <rect x="135" y="0" width="140" height="42" rx="10" fill="#131823" stroke="#2D3B55" />
    <text x="205" y="26" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">TypeScript</text>

    <!-- Node.js -->
    <rect x="290" y="0" width="120" height="42" rx="10" fill="#131823" stroke="#2D3B55" />
    <text x="350" y="26" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Node.js</text>

    <!-- Apache Kafka -->
    <rect x="425" y="0" width="150" height="42" rx="10" fill="#131823" stroke="#2D3B55" />
    <text x="500" y="26" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Apache Kafka</text>

    <!-- PostgreSQL -->
    <rect x="590" y="0" width="150" height="42" rx="10" fill="#131823" stroke="#2D3B55" />
    <text x="665" y="26" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">PostgreSQL 16</text>

    <!-- Redis -->
    <rect x="755" y="0" width="110" height="42" rx="10" fill="#131823" stroke="#2D3B55" />
    <text x="810" y="26" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Redis 7</text>
  </g>

  <!-- Featured System Highlight Box -->
  <rect x="80" y="430" width="1040" height="110" rx="16" fill="#0F131A" stroke="#1F293D" />
  <text x="110" y="470" fill="#60A5FA" font-family="monospace" font-size="14" font-weight="700">FEATURED: FRAUDSHIELD</text>
  <text x="110" y="505" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="16">
    Distributed real-time fraud mitigation & digital banking platform across 8 microservices & 7 Kafka event streams.
  </text>
  <text x="1000" y="490" fill="#34D399" font-family="monospace" font-size="15" font-weight="700" text-anchor="end">371k RPS • 7.38ms p95</text>
</svg>
